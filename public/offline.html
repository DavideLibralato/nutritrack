<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sei offline — NutriTrack</title>
    <!--
      Mostrata dal service worker (sw.js) quando manca la rete e questa
      pagina non è mai stata salvata sul dispositivo. File statico, fuori
      da Next: i colori sono le stesse variabili di src/app/globals.css,
      ricopiate qui perché questa pagina non carica il CSS dell'app. Se
      cambia la palette, va aggiornata anche qui (e il numero delle cache
      in sw.js, perché il file è salvato all'installazione). Solo i token
      che servono a questa pagina, con gli stessi valori, gli stessi
      interruttori del tema e gli stessi colori principali: lo controlla
      src/app/temaScuro.test.ts.

      Lo script qui sotto è la copia di quello che src/app/layout.tsx mette
      in <head> (SCRIPT_TEMA in src/lib/tema.ts): segue le scelte di
      Impostazioni > Aspetto, tema e colore principale. src/lib/tema.test.ts fa girare l'originale e
      questa copia sugli stessi casi.
    -->
    <meta name="theme-color" content="#faf7f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1815" media="(prefers-color-scheme: dark)" />
    <script>
      (function () {
        function temaEffettivo(scelta, sistemaScuro) {
          if (scelta === "chiaro" || scelta === "scuro") return scelta;
          return sistemaScuro ? "scuro" : "chiaro";
        }
        function accentoEffettivo(scelta, accenti) {
          for (var i = 0; i < accenti.length; i++) {
            if (accenti[i] === scelta) return accenti[i];
          }
          return accenti[0];
        }
        var chiaveTema = "nutritrack:tema";
        var chiaveAccento = "nutritrack:accento";
        var accenti = ["verde", "blu", "viola", "petrolio"];
        var colori = { chiaro: "#faf7f2", scuro: "#1b1815" };
        var sistema = window.matchMedia("(prefers-color-scheme: dark)");
        var barra = document.createElement("meta");
        barra.setAttribute("name", "theme-color");
        document.head.prepend(barra);
        function leggi(chiave) {
          try {
            return window.localStorage.getItem(chiave);
          } catch (e) {
            return null;
          }
        }
        function applica() {
          var tema = temaEffettivo(leggi(chiaveTema), sistema.matches);
          document.documentElement.setAttribute("data-tema", tema);
          document.documentElement.setAttribute(
            "data-accento",
            accentoEffettivo(leggi(chiaveAccento), accenti)
          );
          barra.setAttribute("content", colori[tema]);
        }
        applica();
        sistema.addEventListener("change", applica);
        window.addEventListener("storage", function (e) {
          if (e.key === chiaveTema || e.key === chiaveAccento) applica();
        });
      })();
    </script>
    <style>
      :root,
      [data-tema],
      [data-accento] {
        --background: var(--se-chiaro, #faf7f2) var(--se-scuro, #1b1815);
        --foreground: var(--se-chiaro, #1f1b16) var(--se-scuro, #f2ede4);
        --linea: var(--se-chiaro, #e7e0d2) var(--se-scuro, #3a342d);
        --tenue: var(--se-chiaro, #78705f) var(--se-scuro, #a39a8b);
        --accento: var(--se-chiaro, var(--accento-chiaro)) var(--se-scuro, var(--accento-scuro));
        --accento-pieno: var(--accento-chiaro);
        --su-pieno: var(--se-chiaro, var(--background)) var(--se-scuro, #ffffff);
      }
      :root,
      [data-tema="chiaro"] {
        --se-chiaro: initial;
        --se-scuro: ;
        color-scheme: light;
      }
      [data-tema="scuro"] {
        --se-chiaro: ;
        --se-scuro: initial;
        color-scheme: dark;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-tema]) {
          --se-chiaro: ;
          --se-scuro: initial;
          color-scheme: dark;
        }
      }
      :root,
      [data-accento="verde"] {
        --accento-chiaro: #3f7d4c;
        --accento-scuro: #7bb887;
      }
      [data-accento="blu"] {
        --accento-chiaro: #356d96;
        --accento-scuro: #8ab8de;
      }
      [data-accento="viola"] {
        --accento-chiaro: #6b56a0;
        --accento-scuro: #b5a3e0;
      }
      [data-accento="petrolio"] {
        --accento-chiaro: #2c7472;
        --accento-scuro: #6fbdb8;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        background: var(--background);
        color: var(--foreground);
        font-family: system-ui, -apple-system, sans-serif;
        text-align: center;
      }
      main {
        max-width: 22rem;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.75rem;
      }
      p {
        color: var(--tenue);
        line-height: 1.5;
        margin: 0 0 1.5rem;
      }
      button {
        font: inherit;
        font-weight: 600;
        color: var(--su-pieno);
        background: var(--accento-pieno);
        border: 0;
        border-radius: 0.5rem;
        padding: 0.75rem 1.5rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sei offline</h1>
      <p>
        Questa pagina non è ancora salvata sul dispositivo. Apri NutriTrack
        almeno una volta con la connessione, poi funzionerà anche senza.
      </p>
      <button type="button" onclick="location.reload()">Riprova</button>
    </main>
  </body>
</html>
