<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sei offline — NutriTrack</title>
    <!--
      Mostrata dal service worker (sw.js) quando manca la rete e questa
      pagina non è mai stata salvata sul dispositivo. File statico, fuori
      da Next: i colori sono le stesse variabili di src/app/globals.css,
      ricopiate qui perché questa pagina non carica il CSS dell'app. Se
      cambia la palette, va aggiornata anche qui (e il numero delle cache
      in sw.js, perché il file è salvato all'installazione). Solo i token
      che servono a questa pagina, con gli stessi valori, in chiaro e in
      scuro: lo controlla src/app/temaScuro.test.ts.
    -->
    <meta name="theme-color" content="#faf7f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1815" media="(prefers-color-scheme: dark)" />
    <style>
      :root {
        --background: #faf7f2;
        --foreground: #1f1b16;
        --linea: #e7e0d2;
        --tenue: #8a8271;
        --accento: #3f7d4c;
        --accento-pieno: var(--accento);
        --su-pieno: var(--background);
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #1b1815;
          --foreground: #f2ede4;
          --linea: #3a342d;
          --tenue: #a39a8b;
          --accento: #7bb887;
          --accento-pieno: #3f7d4c;
          --su-pieno: #ffffff;
        }
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        background: var(--background);
        color: var(--foreground);
        font-family: system-ui, -apple-system, sans-serif;
        text-align: center;
      }
      main {
        max-width: 22rem;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.75rem;
      }
      p {
        color: var(--tenue);
        line-height: 1.5;
        margin: 0 0 1.5rem;
      }
      button {
        font: inherit;
        font-weight: 600;
        color: var(--su-pieno);
        background: var(--accento-pieno);
        border: 0;
        border-radius: 0.5rem;
        padding: 0.75rem 1.5rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sei offline</h1>
      <p>
        Questa pagina non è ancora salvata sul dispositivo. Apri NutriTrack
        almeno una volta con la connessione, poi funzionerà anche senza.
      </p>
      <button type="button" onclick="location.reload()">Riprova</button>
    </main>
  </body>
</html>
